[package]
name = "tui-kit-ipc"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Draw a Rust terminal app's screen with an Ink renderer in a child process: JSON lines over a Unix socket, one view at a time, restarts, fallback and terminal restore"
repository = "https://github.com/temet-ai/tui-kit"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
