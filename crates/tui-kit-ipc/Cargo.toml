[package]
name = "tui-kit-ipc"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Run a terminal UI's renderer as a child process: JSON lines over a Unix socket, whole-state snapshots one at a time, restarts, fallback and terminal restore"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
